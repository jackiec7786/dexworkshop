name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so typecheck/build can evaluate modules that read env.
      # No real database is contacted during CI.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_placeholder
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
